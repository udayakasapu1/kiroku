name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Name the APK by version
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/kiroku-$VERSION.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: kiroku-${{ env.VERSION }}
          path: out/*.apk
          retention-days: 30

      # On main: publish the APK as a GitHub Release (v<versionName>) so it can be
      # downloaded straight to a phone. Re-running the same version replaces the file.
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Kiroku ${{ env.VERSION }}
          files: out/*.apk
          make_latest: true
          body: |
            Install on Android: open this page on your phone, tap the .apk below, then Install.
            Built from ${{ github.sha }}.
