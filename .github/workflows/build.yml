name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INBOX_TEST_URL: http://localhost:3000
      INBOX_TEST_JWT_SECRET: kiroku-ci-only-secret-0123456789-abcdefghij
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # A Supabase-like server for the web inbox tests: Postgres with the inbox script,
      # behind PostgREST (the API layer Supabase uses).
      - name: Start test inbox server
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q <<'SQL'
          create role anon nologin; create role authenticated nologin;
          create role authenticator login noinherit password 'auth';
          grant anon, authenticated to authenticator;
          grant usage on schema public to anon, authenticated;
          SQL
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f supabase/kiroku_inbox.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f supabase/kiroku_inbox.sql   # safe to run twice
          curl -sSL https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz | tar -xJ
          PGRST_DB_URI="postgres://authenticator:auth@localhost:5432/postgres" PGRST_DB_SCHEMAS=public \
            PGRST_DB_ANON_ROLE=anon PGRST_JWT_SECRET="$INBOX_TEST_JWT_SECRET" PGRST_SERVER_PORT=3000 \
            nohup ./postgrest > postgrest.log 2>&1 &
          for i in $(seq 1 30); do curl -s localhost:3000/ > /dev/null && break; sleep 1; done
          curl -s localhost:3000/ > /dev/null || { cat postgrest.log; exit 1; }

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee gradle-test.log

      # One line per test class (shown as notes on the run), and the build fails if the
      # web inbox sync tests didn't actually run.
      - name: Test report
        if: always()
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          bad = False
          for f in sorted(glob.glob('app/build/test-results/testDebugUnitTest/*.xml')):
              s = ET.parse(f).getroot()
              name = s.get('name').split('.')[-1]
              t, fl, er, sk = (int(s.get(k)) for k in ('tests', 'failures', 'errors', 'skipped'))
              print(f"::notice title={name}::{t - fl - er - sk} passed, {sk} skipped, {fl + er} failed of {t}")
              for case in s.iter('testcase'):
                  if case.find('failure') is not None or case.find('error') is not None:
                      print(f"::error title={name}.{case.get('name')}::failed")
              if name == 'WebInboxSyncTest' and (sk or t == 0):
                  print("::error title=WebInboxSyncTest::sync tests were skipped"); bad = True
          # Compile errors (no test results then): show the first ones as notes on the run.
          import os
          if os.path.exists('gradle-test.log'):
              errs = [l.strip() for l in open('gradle-test.log', errors='replace') if l.startswith('e: ') or 'FAILED' in l or 'What went wrong' in l]
              for l in errs[:8]:
                  print("::error title=Build::" + l.replace('/home/runner/work/kiroku/kiroku/', '')[:900])
          sys.exit(1 if bad else 0)
          PY

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Name the APK by version
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/kiroku-$VERSION.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Release notes: this version's section of CHANGELOG.md plus install steps.
      - name: Release notes
        run: |
          python3 - <<'PY'
          import os, re
          v = os.environ["VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## " + re.escape(v) + r"\b.*?$(.*?)(?=^## |\Z)", text, re.S | re.M)
          head = re.search(r"^## " + re.escape(v) + r"\b.*$", text, re.M)
          notes = (head.group(0)[3:] + "\n" + m.group(1).strip()) if m else "See CHANGELOG.md."
          sha = os.environ["GITHUB_SHA"]
          notes += ("\n\n---\n**Install:** open this page on your phone, tap the .apk below, then Install. "
                    "It installs over your current Kiroku and keeps your data.\n\n"
                    "All versions: [CHANGELOG.md](https://github.com/udayakasapu1/kiroku/blob/main/CHANGELOG.md) · Built from " + sha[:7] + ".\n")
          open("out/notes.md", "w", encoding="utf-8").write(notes)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: kiroku-${{ env.VERSION }}
          path: out/*.apk
          retention-days: 30

      # On main: publish the APK as a GitHub Release (v<versionName>) so it can be
      # downloaded straight to a phone. Re-running the same version replaces the file.
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Kiroku ${{ env.VERSION }}
          files: out/*.apk
          make_latest: true
          body_path: out/notes.md
