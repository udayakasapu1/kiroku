name: Update release notes

# Rewrites every release's description from its section in CHANGELOG.md.
on:
  push:
    branches: [main]
    paths: ["CHANGELOG.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/release_notes.py apply
        env:
          GH_TOKEN: ${{ github.token }}
